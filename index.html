<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tours inmobiliarios</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fafaf8;--fg:#1c1c1a;--card:#fff;--bd:#dcdad2;--ac:#0f6e56}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161615;--fg:#eee;--card:#222220;--bd:#3a3a37;--ac:#3ec99f}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,sans-serif}
#app{max-width:760px;margin:0 auto;padding:16px}#app>*{animation:fi .35s both}
h1{font-size:20px;margin:0 0 12px}h2{font-size:16px;margin:16px 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:10px 0}
button{font:inherit;border:1px solid var(--ac);background:transparent;color:var(--ac);border-radius:8px;padding:8px 12px;cursor:pointer;transition:transform .12s}
button:active{transform:scale(.95)}button.p{background:var(--ac);color:#fff}button.d{border-color:#c33;color:#c33}
input,textarea{font:inherit;width:100%;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--fg);margin:4px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}.muted{opacity:.7;font-size:13px}
.thumbs{display:flex;gap:6px;margin:8px 0;overflow-x:auto}.thumbs i{width:64px;height:48px;border-radius:8px;background-size:cover;background-position:center;flex:none}
.bar{height:6px;background:var(--bd);border-radius:3px;overflow:hidden;display:none}.bar i{display:block;height:100%;width:0;background:var(--ac);transition:width .2s}
input[type=file]{position:fixed;left:-9999px;opacity:0;width:1px}
#tour{position:fixed;inset:0;background:#000;z-index:5;animation:fi .3s}
#stage{position:absolute;inset:0;touch-action:none}#stage canvas{display:block;width:100%;height:100%;touch-action:none}
#top{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:10px;display:flex;gap:8px;z-index:3}
#zb{position:absolute;left:0;right:0;bottom:0;padding:10px 10px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;overflow-x:auto;background:linear-gradient(transparent,rgba(0,0,0,.75));z-index:3}
#tour button,#top a{background:rgba(0,0,0,.55);color:#fff;border:1px solid #fff6;border-radius:8px;padding:8px 12px;white-space:nowrap;text-decoration:none;font-size:15px}
#zb button.on{background:#fff;color:#000}#top a{background:#25d366;border-color:#25d366;color:#04210f;font-weight:600}
#wc{position:absolute;left:12px;right:12px;bottom:calc(70px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:center;z-index:3}
#wc input{flex:1;margin:0}#wc button{font-size:20px;padding:8px 14px;touch-action:none;user-select:none}
#hint{position:absolute;left:0;right:0;top:40%;text-align:center;color:#fff;text-shadow:0 1px 6px #000;font-size:15px;pointer-events:none;animation:fo 4s forwards;z-index:2}
@keyframes fi{from{opacity:0;transform:scale(.98)}to{opacity:1}}@keyframes fo{70%{opacity:1}to{opacity:0}}
</style></head><body><div id="app"></div><div id="tour" hidden><div id="stage"></div><div id="top"></div><div id="zb"></div></div>
<script>window.ADMIN_PIN='';/* clave opcional del panel, ej. '1234' */window.SB_URL='https://nvkutiwrpwpvtjdgwusd.supabase.co';window.SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im52a3V0aXdycHdwdnRqZGd3dXNkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEzMjU2MjIsImV4cCI6MjEwNjkwMTYyMn0.5qsnphNLP81burxH9tTfKJSu00gNegUb5Ipd34S89Fs';</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=s=>document.querySelector(s),app=$('#app');
const uid=()=>Math.random().toString(36).slice(2,9);
const E=t=>String(t||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const link=id=>location.href.split('#')[0]+'#v='+id;
let props=[],cur=null,db,assets,sb=null,BU=id=>'';const subs=[],URLS={};
/* ---------- almacenamiento: local (pruebas) o Supabase ---------- */
const IDB=new Promise((ok,no)=>{const r=indexedDB.open('tours',1);r.onupgradeneeded=()=>{r.result.createObjectStore('props');r.result.createObjectStore('blobs')};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const tx=(st,m,f)=>IDB.then(d=>new Promise((ok,no)=>{const q=f(d.transaction(st,m).objectStore(st));q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)}));
async function setup(){
 if(window.SB_URL&&window.SB_KEY&&window.supabase){
  sb=supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:false,autoRefreshToken:false}});BU=id=>id?SB_URL+'/storage/v1/object/public/tours/'+id:'';
  const note=async()=>{const {data}=await sb.from('properties').select('id,data');subs.forEach(f=>f({docs:(data||[]).map(r=>({id:r.id,data:()=>r.data}))}))};
  db={onSnapshot:f=>{subs.push(f);note()},get:async id=>{const {data}=await sb.rpc('get_property',{pid:id});return data},set:async(id,d)=>{const {error}=await sb.from('properties').upsert({id,data:JSON.parse(JSON.stringify(d))});if(error)throw error;note()},del:async id=>{await sb.from('properties').delete().eq('id',id);note()}};
  assets={upload:async b=>{const id='pub/'+uid()+Date.now().toString(36)+'.jpg',{error}=await sb.storage.from('tours').upload(id,b,{contentType:'image/jpeg'});if(error)throw error;return{id}}};return}
 const note=async()=>{const ks=await tx('props','readonly',x=>x.getAllKeys()),vs=await tx('props','readonly',x=>x.getAll());subs.forEach(f=>f({docs:ks.map((k,i)=>({id:k,data:()=>vs[i]}))}))};
 BU=id=>URLS[id]||'';
 db={onSnapshot:f=>{subs.push(f);note()},get:id=>tx('props','readonly',x=>x.get(id)),set:async(id,d)=>{await tx('props','readwrite',x=>x.put(JSON.parse(JSON.stringify(d)),id));note()},del:async id=>{await tx('props','readwrite',x=>x.delete(id));note()}};
 assets={upload:async b=>{const id=uid()+Date.now().toString(36);await tx('blobs','readwrite',x=>x.put(b,id));URLS[id]=URL.createObjectURL(b);return{id}}};
 const ks=await tx('blobs','readonly',x=>x.getAllKeys()),vs=await tx('blobs','readonly',x=>x.getAll());ks.forEach((k,i)=>URLS[k]=URL.createObjectURL(vs[i]));
}
async function init(){
 await setup();
 const v=location.hash.match(/#v=(\w+)/);
 if(v){await viewer(v[1]);return}
 if(window.ADMIN_PIN){let ok=false;try{ok=localStorage.getItem('pin')===ADMIN_PIN}catch(e){}if(!ok){const p=prompt('Clave de acceso');if(p!==ADMIN_PIN){app.innerHTML='<h1>Acceso restringido</h1>';return}try{localStorage.setItem('pin',p)}catch(e){}}}
 db.onSnapshot(s=>{props=s.docs.map(d=>({id:d.id,...d.data()}));if(!cur)home()});
}
/* ---------- panel ---------- */
function home(){cur=null;
 app.innerHTML='<h1>🏡 Mis propiedades</h1><button class="p" id="n">＋ Nueva propiedad</button>'+
 (props.length?props.map(p=>`<div class="card"><b>${E(p.name)||'Sin nombre'}</b><div class="muted">${(p.zones||[]).length} zonas</div><div class="row"><button data-e="${p.id}">Editar</button><button data-l="${p.id}">Copiar enlace cliente</button><button data-v="${p.id}">Ver</button></div></div>`).join(''):'<p class="muted">Aún no hay propiedades. Crea la primera.</p>');
 $('#n').onclick=()=>edit({id:uid(),name:'',agency:'',wa:'',desc:'',zones:[]});
 app.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>edit(JSON.parse(JSON.stringify(props.find(p=>p.id==b.dataset.e)))));
 app.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>viewer(b.dataset.v));
 app.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{const u=link(b.dataset.l);navigator.clipboard?.writeText(u).catch(()=>{});prompt('Enlace para el cliente:',u)});
}
function thumbs(z){const f=z.type=='pano'?[z.pano]:(z.frames||[]);const n=Math.min(6,f.length);return [...Array(n)].map((_,i)=>f[Math.floor(i*f.length/n)]).map(id=>`<i style="background-image:url(${BU(id)})"></i>`).join('')}
function edit(p){cur=p;
 app.innerHTML=`<button id="b">← Volver</button><h1>Propiedad</h1>
 <input id="nm" placeholder="Nombre (ej. Casa Laureles)" value="${E(p.name)}">
 <input id="ag" placeholder="Nombre de tu inmobiliaria" value="${E(p.agency)}">
 <input id="wa" inputmode="numeric" placeholder="WhatsApp con indicativo (ej. 573001234567)" value="${E(p.wa)}">
 <textarea id="ds" rows="4" placeholder="Descripción: precio, área, habitaciones… (se muestra antes del recorrido)">${E(p.desc)}</textarea>
 <h2>Zonas</h2><p class="muted">Cada zona es un video caminando (el cliente avanza y retrocede) o una foto 360 completa (el cliente mira alrededor).</p><div id="zs"></div><button id="az">＋ Agregar zona</button>
 <div class="row" style="margin-top:16px"><button class="p" id="sv">Guardar</button><button class="d" id="dl">Eliminar propiedad</button></div>`;
 const zs=$('#zs');
 const draw=()=>{zs.innerHTML='';p.zones.forEach((z,i)=>{const d=document.createElement('div');d.className='card';
  d.innerHTML=`<input placeholder="Nombre de la zona (Sala, Cocina…)" value="${E(z.name)}"><textarea rows="2" placeholder="Descripción breve de la zona">${E(z.desc)}</textarea>
  <div class="row"><button class="p" data-k="cam">🎥 Grabar video</button><button data-k="gal">📁 Video de galería</button><button data-k="pan">🌐 Foto 360</button></div>
  <input type="file" accept="video/*" capture="environment" data-f="cam"><input type="file" accept="video/*" data-f="gal"><input type="file" accept="image/*" data-f="pan">
  <div class="muted st">${z.type=='pano'?'Foto 360 lista':z.frames?z.frames.length+' pasos listos':'Sin contenido todavía'}</div><div class="bar"><i></i></div><div class="thumbs">${thumbs(z)}</div><button class="d rm">Quitar zona</button>`;
  const [n,t]=d.querySelectorAll('input:not([type=file]),textarea');n.oninput=()=>z.name=n.value;t.oninput=()=>z.desc=t.value;
  const st=d.querySelector('.st'),bar=d.querySelector('.bar'),bi=bar.firstChild;
  d.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>d.querySelector(`[data-f=${b.dataset.k}]`).click());
  d.querySelectorAll('[data-f]').forEach(f=>f.onchange=async()=>{const file=f.files[0];if(!file)return;bar.style.display='block';
   try{if(f.dataset.f=='pan'){st.textContent='Subiendo foto 360…';bi.style.width='50%';z.pano=(await assets.upload(await shrink(file,4096))).id;z.type='pano';delete z.frames}
    else{st.textContent='Procesando video…';z.frames=await frames(file,x=>{bi.style.width=x*100+'%';st.textContent='Procesando video… '+Math.round(x*100)+'%'});z.type='walk';delete z.pano}
    bi.style.width='100%';st.textContent=(z.type=='pano'?'Foto 360 lista':z.frames.length+' pasos listos')+' · recuerda pulsar Guardar';d.querySelector('.thumbs').innerHTML=thumbs(z)}
   catch(e){st.textContent='Error: '+(e.message||e.code||e)}f.value=''});
  d.querySelector('.rm').onclick=()=>{p.zones.splice(i,1);draw()};zs.appendChild(d)})};
 draw();
 $('#az').onclick=()=>{p.zones.push({id:uid(),name:'',desc:''});draw()};
 $('#b').onclick=home;
 $('#sv').onclick=async()=>{p.name=$('#nm').value;p.agency=$('#ag').value;p.wa=$('#wa').value.replace(/\D/g,'');p.desc=$('#ds').value;
  try{await db.set(p.id,p);home()}catch(e){alert('Error al guardar: '+(e.message||e.code))}};
 $('#dl').onclick=async()=>{if(confirm('¿Eliminar esta propiedad?')){try{await db.del(p.id)}catch(e){}home()}};
}
function shrink(f,max){return new Promise((ok,no)=>{const im=new Image();im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(b=>b?ok(b):no(new Error('imagen')),'image/jpeg',.88)};im.onerror=()=>no(new Error('No se pudo leer la imagen'));im.src=URL.createObjectURL(f)})}
/* video -> pasos (fotogramas) */
async function frames(file,prog){
 const v=document.createElement('video');v.muted=true;v.playsInline=true;v.preload='auto';v.src=URL.createObjectURL(file);
 await new Promise((ok,no)=>{v.onloadedmetadata=ok;v.onerror=()=>no(new Error('No se pudo leer el video'))});
 const d=v.duration;if(!isFinite(d)||d<2)throw new Error('El video es muy corto');
 const n=Math.max(10,Math.min(160,Math.round(d*3))),sc=Math.min(1,1280/Math.max(v.videoWidth,v.videoHeight)),c=document.createElement('canvas');
 c.width=Math.round(v.videoWidth*sc);c.height=Math.round(v.videoHeight*sc);const x=c.getContext('2d'),ids=[],jobs=[];
 for(let i=0;i<n;i++){
  const w=new Promise(r=>{v.onseeked=r;setTimeout(r,2000)});v.currentTime=Math.max(.01,Math.min(d-.05,i*d/n));await w;
  x.drawImage(v,0,0,c.width,c.height);
  const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.8));
  jobs.push(assets.upload(b).then(r=>{ids[i]=r.id}));
  if(jobs.length%4==0)await Promise.all(jobs.slice(-4));
  prog((i+1)/n*.95);
 }
 await Promise.all(jobs);URL.revokeObjectURL(v.src);return ids}
/* ---------- vista del cliente ---------- */
async function viewer(id){
 let p=props.find(q=>q.id==id);
 if(!p){try{p=await db.get(id)}catch(e){}}
 if(!p){app.innerHTML='<h1>Propiedad no encontrada</h1>';return}
 app.innerHTML=`${p.agency?`<div class="muted">${E(p.agency)}</div>`:''}<h1>${E(p.name)}</h1><p style="white-space:pre-wrap">${E(p.desc)}</p>`+(p.zones||[]).map(z=>`<div class="card"><b>${E(z.name)}</b><div class="muted">${E(z.desc)}</div></div>`).join('')+'<div class="row"><button class="p" id="go">Entrar al recorrido</button></div>'+(location.hash?'':'<p><button id="b2">← Volver</button></p>');
 $('#go').onclick=()=>tour(p);const b2=$('#b2');if(b2)b2.onclick=home;
}
let off=null;
function tour(p){const T=$('#tour'),st=$('#stage'),zb=$('#zb');T.hidden=false;zb.innerHTML='';
 $('#top').innerHTML=(p.wa?`<a href="https://wa.me/${p.wa}?text=${encodeURIComponent('Hola, me interesa '+p.name)}" target="_blank" rel="noopener">WhatsApp</a>`:'')+'<button id="x">✕</button>';
 const zs=(p.zones||[]).filter(z=>z.type=='pano'?z.pano:z.frames&&z.frames.length);
 const open=i=>{off&&off();zb.querySelectorAll('button').forEach((b,k)=>b.classList.toggle('on',k==i));off=zs[i].type=='pano'?pano(zs[i].pano,st):walk(zs[i],st)};
 zs.forEach((z,i)=>{const b=document.createElement('button');b.textContent=z.name||'Zona '+(i+1);b.onclick=()=>open(i);zb.appendChild(b)});
 $('#x').onclick=()=>{off&&off();off=null;st.innerHTML='';T.hidden=true};
 if(zs.length)open(0);else st.innerHTML='<p style="color:#fff;padding:60px 20px">Esta propiedad aún no tiene contenido.</p>';
}
/* caminar: avanzar/retroceder por los pasos */
function walk(z,box){const N=z.frames.length;
 box.innerHTML=`<canvas></canvas><div id="hint">Desliza hacia los lados o mantén ▶ para avanzar</div><div id="wc"><button id="bk">◀</button><button id="pl">⏵</button><button id="fw">▶</button><input id="sl" type="range" min="0" max="${N-1}" value="0"></div>`;
 const cv=box.querySelector('canvas'),cx=cv.getContext('2d'),sl=box.querySelector('#sl');let p=0,t=null,d=null;
 const im=z.frames.map(id=>{const i=new Image();i.crossOrigin='anonymous';i.onload=draw;i.src=BU(id);return i});
 function draw(){const W=cv.width=box.clientWidth,H=cv.height=box.clientHeight,i=im[Math.round(p)];if(!i||!i.naturalWidth)return;const s=Math.max(W/i.naturalWidth,H/i.naturalHeight);cx.drawImage(i,(W-i.naturalWidth*s)/2,(H-i.naturalHeight*s)/2,i.naturalWidth*s,i.naturalHeight*s)}
 const go=v=>{p=Math.max(0,Math.min(N-1,v));sl.value=p;draw();if(p==N-1||p==0)stop()},stop=()=>{clearInterval(t);t=null},run=dir=>{stop();t=setInterval(()=>go(p+dir*.3),50)};
 const bk=box.querySelector('#bk'),fw=box.querySelector('#fw'),pl=box.querySelector('#pl');
 bk.onpointerdown=()=>run(-1);fw.onpointerdown=()=>run(1);bk.onpointerup=bk.onpointerleave=fw.onpointerup=fw.onpointerleave=stop;
 pl.onclick=()=>t?stop():run(1);sl.oninput=()=>{stop();go(+sl.value)};
 cv.onpointerdown=e=>{stop();d={x:e.clientX,p};cv.setPointerCapture(e.pointerId)};cv.onpointermove=e=>{if(d)go(d.p-(e.clientX-d.x)/9)};cv.onpointerup=()=>d=null;
 addEventListener('resize',draw);draw();
 return()=>{stop();removeEventListener('resize',draw)}}
/* foto 360 completa */
function pano(id,box){box.innerHTML='';
 const R=new THREE.WebGLRenderer({antialias:true}),sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(75,1,1,1100),g=new THREE.SphereGeometry(500,60,40);g.scale(-1,1,1);box.appendChild(R.domElement);
 sc.add(new THREE.Mesh(g,new THREE.MeshBasicMaterial({map:new THREE.TextureLoader().load(BU(id))})));
 let lon=0,lat=0,fov=75,d=null,raf;const fit=()=>{R.setSize(box.clientWidth,box.clientHeight);cam.aspect=box.clientWidth/box.clientHeight;cam.updateProjectionMatrix()};fit();
 const dn=e=>d={x:e.clientX,y:e.clientY,a:lon,b:lat},mv=e=>{if(d){lon=d.a-(e.clientX-d.x)*.2;lat=Math.max(-85,Math.min(85,d.b+(e.clientY-d.y)*.2))}},up=()=>d=null,wh=e=>{fov=Math.max(35,Math.min(100,fov+e.deltaY*.05))};
 box.addEventListener('pointerdown',dn);addEventListener('pointermove',mv);addEventListener('pointerup',up);box.addEventListener('wheel',wh,{passive:true});addEventListener('resize',fit);
 const loop=()=>{raf=requestAnimationFrame(loop);const a=lon*Math.PI/180,b=lat*Math.PI/180;cam.fov=fov;cam.updateProjectionMatrix();cam.lookAt(Math.sin(a)*Math.cos(b),Math.sin(b),-Math.cos(a)*Math.cos(b));R.render(sc,cam)};loop();
 return()=>{cancelAnimationFrame(raf);box.removeEventListener('pointerdown',dn);box.removeEventListener('wheel',wh);removeEventListener('pointermove',mv);removeEventListener('pointerup',up);removeEventListener('resize',fit);R.dispose()}}
init();
</script></body></html>
